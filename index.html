<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    

   

    <div class="snake-wrapper" aria-label="Animated snake">
        <div class="snake">
            <div class="segment"></div>
            <div class="segment"></div>
            <div class="segment"></div>
            <div class="segment"></div>
            <div class="segment"></div>
            <div class="segment"></div>
            <div class="segment"></div>
            <div class="segment head"></div>
        </div>
    </div>

    <!-- START OF CHECKLIST -->
    <div class="site-checklist">
        <div class="checklist-header">
            <h3>✅ Things We Need To Do:</h3>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
        </div>
        <div class="add-task-container">
            <input type="text" id="taskInput" class="task-input" placeholder="Add a new task..." />
            <button class="add-btn" id="addBtn">Add</button>
        </div>
        <ul class="checklist-list" id="taskList">
            <li class="task-item">
                <input type="checkbox" class="task-checkbox" />
                <span class="task-text">Sample task</span>
                <button class="delete-btn" title="Delete task">🗑️</button>
            </li>
        </ul>
    </div>
    <!-- END OF CHECKLIST -->

    <script src="app.js"></script>
</body>
</html>
